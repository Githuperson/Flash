# Diagnostic: why does macOS arm64 reject Flash's static Mach-O? Prints facts, never fails.
name: macho-probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/macho-probe.yml"]
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p flash
      - name: Probe
        continue-on-error: true
        run: |
          set +e
          uname -a; sw_vers
          mkdir -p /tmp/p && cd /tmp/p
          F=$GITHUB_WORKSPACE/target/release/flash
          $F build $GITHUB_WORKSPACE/examples/hello.flash --target aarch64-apple-darwin -o flash_hello
          echo "== run flash_hello"; ./flash_hello; echo "rc=$?"
          echo "== codesign verify"; codesign -dvvv flash_hello 2>&1; codesign --verify --verbose=4 flash_hello 2>&1
          echo "== otool -l (flash)"; otool -l flash_hello | head -120
          echo "== kernel log"; sudo log show --last 2m --info --debug --predicate 'eventMessage CONTAINS[c] "flash_hello" OR process == "kernel" AND eventMessage CONTAINS[c] "AMFI"' 2>&1 | tail -40
          printf '.globl _main\n.p2align 2\n_main:\n  mov x0, #0\n  mov x16, #1\n  svc #0x80\n' > ref.s
          echo "== reference dynamic (libSystem), raw svc exit"
          clang -o ref_dyn ref.s && ./ref_dyn; echo "rc=$?"
          otool -l ref_dyn | grep -A6 -E "CHAINED|EXPORTS|SYMTAB|LOAD_DYLIB|LC_MAIN|LC_BUILD"
          echo "== reference chained fixups / trie bytes"
          dyldinfo -export ref_dyn 2>&1 | head -5
          python3 - <<'PY'
          import struct,subprocess
          d=open('ref_dyn','rb').read()
          n=struct.unpack_from('<I',d,16)[0]; off=32
          for _ in range(n):
              c,sz=struct.unpack_from('<II',d,off)
              if c in (0x80000034,0x80000033,0x2):
                  o,l=struct.unpack_from('<II',d,off+8)
                  print(hex(c),'at',o,'len',l, d[o:o+min(l,96)].hex())
              off+=sz
          PY
