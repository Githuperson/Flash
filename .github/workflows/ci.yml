# Continuous integration. NOTE: this workflow was written together with the compiler but has not
# been run by the author (the development environment was a single Linux x86-64 machine).
#  * "native": the default build, which contains only Flash's own back end (Linux x86-64, and
#    macOS arm64 on a hosted Apple Silicon runner).
#  * "legacy": additionally builds and tests the optional Cranelift/LLVM back ends, `extern fn`
#    and plugins (needs a C compiler); use it where the native AArch64 back end (emulator-tested
#    only) is not trusted yet.
name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, flags: "",                           name: native }
          - { os: ubuntu-latest, flags: "--features legacy-backends", name: legacy }
          - { os: macos-latest,  flags: "",                           name: native }
          - { os: macos-latest,  flags: "--features legacy-backends", name: legacy }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: AArch64 emulator (for tests/native_aarch64.rs)
        if: matrix.os == 'ubuntu-latest' && matrix.name == 'native'
        run: pip install unicorn
      - name: Build
        run: cargo build -p flash ${{ matrix.flags }}
      - name: Build the C++ example plugin
        if: matrix.name == 'legacy'
        run: make -C plugins/cpp/geometry
      - name: Test
        run: cargo test -p flash ${{ matrix.flags }}
      - name: Flash self-tests
        run: ./target/debug/flash test tests/flash

  # Windows: the compiler builds and its output runs natively (the Cargo test suite itself has
  # Unix assumptions and is not run here; the programs below are compared with their expected output).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p flash
      - name: Unit tests
        run: cargo test --release -p flash --lib
      - name: Programs run natively on Windows
        shell: bash
        run: |
          set -e
          flash=./target/release/flash.exe
          for mode in "" "--release"; do
            for f in examples/*.flash tests/programs/*.flash; do
              exp="${f%.flash}.expected"
              [ -f "$exp" ] || continue
              case "$f" in *plugins_demo*) continue;; esac
              $flash build "$f" $mode -o prog.exe > /dev/null
              ./prog.exe > out.txt
              cmp out.txt "$exp" || { echo "FAILED: $f $mode"; exit 1; }
            done
          done
          echo "all programs match"
      - name: Arguments, environment, files, stdin, exit code
        shell: bash
        run: |
          ./target/release/flash.exe build tests/native_io/io.flash -o io.exe > /dev/null
          set +e
          echo "input line" | ./io.exe a "b c" d > io_out.txt
          code=$?
          set -e
          cat io_out.txt
          test "$code" = 3
          cmp io_out.txt tests/native_io/io.expected
      - name: Benchmarks give the same answers as on Linux
        shell: bash
        run: |
          for b in strings sieve mandelbrot; do
            ./target/release/flash.exe build benchmarks/$b.flash --release -o bench.exe > /dev/null
            ./bench.exe
          done
