# Continuous integration. NOTE: this workflow was written together with the compiler but has not
# been run by the author (the development environment was a single Linux x86-64 machine); the
# macOS job is where the Apple Silicon / macOS linking path would first be exercised.
name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace
      - name: Build the C++ example plugin
        run: make -C plugins/cpp/geometry
      - name: Test
        run: cargo test --workspace
      - name: Flash self-tests
        run: ./target/debug/flash test tests/flash
