[package]
name = "flash-rt"
version = "0.2.0"
edition = "2021"
description = "Flash runtime: linked into every compiled Flash program"
license = "MIT"

[lib]
name = "flash_rt"
crate-type = ["staticlib", "rlib"]

[dependencies]
libloading = "0.9"
flash-plugin-sdk = { path = "../flash-plugin-sdk" }
sha2 = "0.10"
object = { version = "0.40", default-features = false, features = ["read", "elf", "std"] }
libc = "0.2"

[[bin]]
name = "flash-stub"
path = "src/bin/flash-stub.rs"
test = false
